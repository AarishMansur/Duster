<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Five Good Ones{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.1.10"></script>
  <style>
    :root {
      --bg: #fafaf9;
      --card: #ffffff;
      --border: #e7e5e4;
      --text: #1c1917;
      --muted: #78716c;
      --accent: #4f46e5;
      --accent-dark: #4338ca;
      --danger: #dc2626;
      --success: #059669;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
    }
    header .brand {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text);
      text-decoration: none;
    }
    header nav { display: flex; gap: 1rem; }
    header nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.925rem;
    }
    header nav a:hover { color: var(--text); }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .card h3 { margin: 0 0 0.75rem; font-size: 1rem; }
    label {
      display: block;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.35rem;
    }
    .hint { color: var(--muted); font-size: 0.85rem; font-weight: 400; }
    .muted { color: var(--muted); font-size: 0.875rem; }
    textarea, input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 0.6rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      font-size: 0.95rem;
      background: #fff;
    }
    textarea { resize: vertical; min-height: 5rem; }
    textarea:focus, input:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
      border-color: var(--accent);
    }
    .field { margin-bottom: 1.1rem; }
    button, .btn {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.2rem;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    button:hover, .btn:hover { background: var(--accent-dark); }
    button.secondary, .btn.secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.secondary:hover, .btn.secondary:hover { background: #f5f5f4; }
    .banner {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
      border-radius: 8px;
      padding: 0.7rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.925rem;
    }
    .privacy-note {
      color: var(--muted);
      font-size: 0.875rem;
      border-left: 3px solid var(--border);
      padding-left: 0.75rem;
      margin-top: 1.25rem;
    }
    h1 { font-size: 1.4rem; margin: 0 0 1rem; }

    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .tab {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.5rem 1rem;
      font-size: 0.925rem;
    }
    .tab.active {
      color: var(--accent);
      border-color: var(--accent);
      font-weight: 600;
    }
    .badge {
      display: inline-block;
      background: #f5f5f4;
      border-radius: 999px;
      padding: 0.05rem 0.5rem;
      font-size: 0.8rem;
      margin-left: 0.25rem;
    }
    .tab.active .badge { background: #e0e7ff; }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }
    .confidence {
      background: #e0e7ff;
      color: var(--accent-dark);
      border-radius: 999px;
      padding: 0.15rem 0.65rem;
      font-size: 0.825rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .reason { color: var(--muted); font-size: 0.9rem; margin: 0.5rem 0 0.75rem; }
    .actions { display: flex; gap: 0.5rem; align-items: center; }
    .applied-tag { color: var(--success); font-weight: 600; font-size: 0.925rem; }
    .budget-reached { color: var(--danger); font-weight: 600; font-size: 0.925rem; }
    .budget-line { margin: 0 0 1rem; }
    .classify-bar { display: flex; align-items: center; gap: 1rem; }
    .applied-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: 0.5rem 0;
      border-top: 1px solid var(--border);
    }
    .applied-row:first-of-type { border-top: none; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">Five Good Ones</a>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/settings">Settings</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
