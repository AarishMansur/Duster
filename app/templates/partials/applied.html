{% if not weeks %}
<div class="card"><p class="muted">No applications yet.</p></div>
{% endif %}

{% for week, items in weeks.items() %}
<div class="card">
  <h3>Week of {{ week }}</h3>
  {% for app, job in items %}
  <div class="applied-row">
    <div>
      <strong>{{ job.title }}</strong><br>
      <span class="muted">{{ job.company }} · applied {{ app.created_at.strftime('%b %d') }}</span>
    </div>
    <a href="{{ job.url }}" target="_blank" class="btn secondary">View</a>
  </div>
  {% endfor %}
</div>
{% endfor %}
