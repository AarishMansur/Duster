{% if not rows %}
<div class="card"><p class="muted">Nothing skipped.</p></div>
{% endif %}

{% for verdict, job in rows %}
<div class="card" id="card-{{ job.id }}">
  <div class="card-head">
    <div>
      <strong>{{ job.title }}</strong><br>
      <span class="muted">{{ job.company }}{% if job.location %} · {{ job.location }}{% endif %}</span>
    </div>
  </div>
  <p class="reason">{{ verdict.reason }}</p>
  <div class="actions">
    <button hx-post="/override/{{ job.id }}" hx-target="#card-{{ job.id }}" hx-swap="outerHTML">Move to For You</button>
  </div>
</div>
{% endfor %}
