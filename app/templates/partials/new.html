<div class="card classify-bar">
  <button hx-post="/api/classify"
          hx-on::after-request="htmx.ajax('GET', '/tab/new', '#tab-content')">
    Classify {{ jobs|length }} new job{{ 's' if jobs|length != 1 else '' }}
  </button>
  <span class="muted">from the last 7 days · {{ classifier_name }}</span>
</div>

{% for job in jobs %}
<div class="card">
  <div class="card-head">
    <div>
      <strong>{{ job.title }}</strong><br>
      <span class="muted">{{ job.company }}{% if job.location %} · {{ job.location }}{% endif %} · {{ job.source }}</span>
    </div>
  </div>
</div>
{% endfor %}
